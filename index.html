s.length*cols.length*5){\n    const rd=Object.fromEntries(rows.map(r=>[r,rowTotals[r]-cols.reduce((a,c)=>a+floor[r][c],0)]));\n    const cd=Object.fromEntries(cols.map(c=>[c,colTotals[c]-rows.reduce((a,r)=>a+floor[r][c],0)]));\n    const cand=[];\n    rows.forEach(r=>cols.forEach(c=>{\n      if(rd[r]>0&&cd[c]>0)cand.push({r,c,f:m[r][c]-floor[r][c]});\n    }));\n    if(!cand.length)break;\n    cand.sort((a,b)=>b.f-a.f||String(a.r).localeCompare(String(b.r))||String(a.c).localeCompare(String(b.c)));\n    floor[cand[0].r][cand[0].c]++;\n  }\n  return floor;\n}\n\n/* Premio Camera: distribuzione prospettica dei 70 seggi per circoscrizione.\n   I seggi premio restano separati dai seggi ordinari dei collegi plurinominali. */\nconst CAMERA_PRIZE_BY_CIRC={\n \"Piemonte 1\":3,\"Piemonte 2\":2,\"Lombardia 1\":5,\"Lombardia 2\":2,\"Lombardia 3\":3,\"Lombardia 4\":2,\n \"Veneto 1\":2,\"Veneto 2\":4,\"Friuli-Venezia Giulia\":1,\"Liguria\":2,\"Emilia-Romagna\":5,\"Toscana\":4,\n \"Umbria\":1,\"Marche\":2,\"Lazio 1\":5,\"Lazio 2\":2,\"Abruzzo\":2,\"Molise\":0,\"Campania 1\":4,\"Campania 2\":3,\n \"Puglia\":5,\"Basilicata\":1,\"Calabria\":2,\"Sicilia 1\":3,\"Sicilia 2\":3,\"Sardegna\":2\n};\nconst SENATE_PRIZE_BY_REGION={\n \"Piemonte\":3,\"Lombardia\":6,\"Veneto\":3,\"Friuli-Venezia Giulia\":1,\"Liguria\":1,\"Emilia-Romagna\":3,\"Toscana\":2,\n \"Umbria\":1,\"Marche\":1,\"Lazio\":3,\"Abruzzo\":1,\"Molise\":0,\"Campania\":3,\"Puglia\":2,\"Basilicata\":0,\"Calabria\":1,\"Sicilia\":3,\"Sardegna\":1\n};\nfunction prizeSeatsInCirc(ch,circ){return ch===\"camera\"?(CAMERA_PRIZE_BY_CIRC[circ]||0):(SENATE_PRIZE_BY_REGION[circ]||0)}\nfunction circumSeatTotals(ch,withPrize){\n  const out={};\n  ordinaryCircs(ch).forEach(c=>out[c]=collegeListForCirc(ch,c).reduce((a,x)=>a+(withPrize?x.withPrize:x.withoutPrize),0));\n  return out;\n}\n\n/* Senato: il riparto ordinario avviene su base regionale. */\nfunction senateSeatPlan(ch,withPrize){\n  const regions=ordinaryCircs(ch),winner=withPrize?prize():null;\n  const rawByRegion={},entityByRegion={},winnerEntityId=winner?winner.type+\":\"+winner.name:null;\n  const entityRowsByRegion={};\n  regions.forEach(region=>{\n    const ents=eligibleEntities(ch).map(e=>({...e,v:entityVoteInRegion(e,ch,region)})).filter(e=>e.v>0);\n    const total=circumSeatTotals(ch,withPrize)[region]||0;\n    const rows=hare(ents.map(e=>({id:e.id,name:e.name,type:e.type,members:e.members,v:e.v})),total);\n    rawByRegion[region]=rows;\n    entityRowsByRegion[region]=rows;\n  });\n  // Il tetto di 113 seggi nel territorio nazionale per il soggetto premiato viene verificato dopo il riparto regionale.\n  if(withPrize&&winner){\n    let wTotal=regions.reduce((a,r)=>a+((rawByRegion[r].find(x=>x.type===winner.type&&x.name===winner.name)?.seats)||0),0);\n    const cap=winnerOrdinaryCap(\"senato\");\n    if(wTotal>cap){\n      const removals=[];\n      regions.forEach(region=>{\n        const row=rawByRegion[region].find(x=>x.type===winner.type&&x.name===winner.name);\n        if(row&&row.seats>0)removals.push({region,row,score:row.rem});\n      });\n      removals.sort((a,b)=>a.score-b.score);\n      let excess=wTotal-cap,ri=0;\n      while(excess>0&&ri<removals.length){\n        const r=removals[ri];\n        if(r.row.seats>0){\n          r.row.seats--;excess--;wTotal--;\n          const recipients=rawByRegion[r.region].filter(x=>x.id!==r.row.id).sort((a,b)=>b.rem-a.rem||b.v-a.v);\n          if(recipients[0])recipients[0].seats++;\n        }else ri++;\n        if(r.row.seats===0)ri++;\n      }\n    }\n  }\n  const listByRegion={};\n  regions.forEach(region=>{\n    const rows=rawByRegion[region],out={};\n    rows.forEach(e=>{\n      if(e.type===\"party\"){out[e.name]=e.seats;return}\n      const members=coalitionMembersForAllocation(e,ch).map(p=>({name:p,v:n(state.circVotes[ch][region]?.[p]??0)}));\n      hare(members,e.seats).forEach(x=>{out[x.name]=(out[x.name]||0)+x.seats});\n    });\n    listByRegion[region]=out;\n  });\n  const aggregate={};\n  regions.forEach(region=>Object.entries(listByRegion[region]).forEach(([p,v])=>aggregate[p]=(aggregate[p]||0)+v));\n  return {listSeats:aggregate,byRegion:listByRegion,circSeats:circumSeatTotals(ch,withPrize),entityRowsByRegion};\n}\n\nfunction allocateNationalToCircs(ch,withPrize=usePrize()){\n  if(ch===\"senato\"){\n    const plan=senateSeatPlan(ch,withPrize);\n    const matrix={};\n    Object.entries(plan.byRegion).forEach(([region,map])=>{\n      Object.keys(map).forEach(p=>{\n        matrix[p]=matrix[p]||{};\n        matrix[p][region]=map[p]||0;\n      });\n    });\n    return {listSeats:plan.listSeats,circSeats:plan.circSeats,matrix};\n  }\n  const listSeats=nationalListSeats(ch,withPrize),circs=circumSeatTotals(ch,withPrize);\n  const matrix=biprop(listSeats,circs,(p,c)=>state.circVotes[ch][c]?.[p]??state.nationalVotes[ch][p]??0);\n  return {listSeats,circSeats:circs,matrix};\n}\nfunction listSeatsInCirc(ch,circ,withPrize=usePrize()){\n  const data=allocateNationalToCircs(ch,withPrize),out={};\n  Object.keys(data.matrix).forEach(p=>{out[p]=data.matrix[p][circ]||0});\n  return out;\n}\n\n/* Riparto collegiale. Nel caso premio applichiamo separatamente gruppo di maggioranza e gruppo di minoranza,\n   con i rispettivi quozienti circoscrizionali e successivo riparto vincolato nei collegi. */\nfunction groupSeatsInColleges(ch,circ,withPrize,colTotals,majorityLists,minorityLists){\n  const cols=Object.keys(colTotals);\n  const majNames=Object.keys(majorityLists).filter(p=>n(majorityLists[p])>0);\n  const minNames=Object.keys(minorityLists).filter(p=>n(minorityLists[p])>0);\n  const majTotal=majNames.reduce((a,p)=>a+n(majorityLists[p]),0);\n  const minTotal=minNames.reduce((a,p)=>a+n(minorityLists[p]),0);\n  const majVotes=majNames.reduce((a,p)=>a+n(state.circVotes[ch][circ]?.[p]??0),0);\n  const minVotes=minNames.reduce((a,p)=>a+n(state.circVotes[ch][circ]?.[p]??0),0);\n  const majQ=majTotal>0?Math.floor(majVotes/majTotal):0;\n  const minQ=minTotal>0?Math.floor(minVotes/minTotal):0;\n  const raw={maj:{},min:{}},frac={maj:{},min:{}};\n  cols.forEach(cid=>{\n    const mv=majNames.reduce((a,p)=>a+n(state.collegeVotes[ch][cid]?.[p]??0),0);\n    const nv=minNames.reduce((a,p)=>a+n(state.collegeVotes[ch][cid]?.[p]??0),0);\n    raw.maj[cid]=majQ>0?mv/majQ:0;\n    raw.min[cid]=minQ>0?nv/minQ:0;\n  });\n\n  const out={maj:{},min:{}};\n  cols.forEach(cid=>{out.maj[cid]=0;out.min[cid]=0;});\n  cols.forEach(cid=>{\n    const seats=colTotals[cid],a=raw.maj[cid],b=raw.min[cid],sum=a+b;\n    if(!sum){\n      if(minTotal>0)out.min[cid]=seats;else out.maj[cid]=seats;\n      frac.maj[cid]=0;frac.min[cid]=0;\n      return;\n    }\n    const qa=a/sum*seats,qb=b/sum*seats;\n    out.maj[cid]=Math.floor(qa);out.min[cid]=Math.floor(qb);\n    frac.maj[cid]=qa-out.maj[cid];frac.min[cid]=qb-out.min[cid];\n    if(out.maj[cid]+out.min[cid]<seats){\n      if(frac.maj[cid]>frac.min[cid])out.maj[cid]++;else out.min[cid]++;\n    }\n  });\n\n  const sumGroup=g=>cols.reduce((a,c)=>a+out[g][c],0);\n  let majNow=sumGroup(\"maj\");\n  let guard=0;\n  while(majNow!==majTotal&&guard++<cols.length*10){\n    if(majNow>majTotal){\n      const candidates=cols.filter(cid=>out.maj[cid]>0&&out.min[cid]<colTotals[cid]);\n      if(!candidates.length)break;\n      candidates.sort((a,b)=>(frac.maj[a]-frac.min[a])-(frac.maj[b]-frac.min[b])||raw.maj[a]-raw.maj[b]);\n      const cid=candidates[0];out.maj[cid]--;out.min[cid]++;majNow--;\n    }else{\n      const candidates=cols.filter(cid=>out.min[cid]>0&&out.maj[cid]<colTotals[cid]);\n      if(!candidates.length)break;\n      candidates.sort((a,b)=>(frac.maj[b]-frac.min[b])-(frac.maj[a]-frac.min[a])||raw.maj[b]-raw.maj[a]);\n      const cid=candidates[0];out.min[cid]--;out.maj[cid]++;majNow++;\n    }\n  }\n  return out;\n}function collegeMatrix(ch,circ,withPrize=usePrize()){\n  const cols=collegeListForCirc(ch,circ),colTotals={};\n  if(circ===\"Trentino-Alto Adige\"){\n    const seatsT=ch===\"camera\"?3:0;\n    const names=PARTIES.filter(p=>n(state.collegeVotes[ch][cols[0]?.id]?.[p])>0);\n    const vals=names.map(p=>({p,v:n(state.collegeVotes[ch][cols[0]?.id]?.[p])}));\n    const a=hare(vals,seatsT),out={};a.forEach(x=>{out[x.p]={[cols[0]?.id]:x.seats}});return out;\n  }\n  cols.forEach(c=>colTotals[c.id]=withPrize?c.withPrize:c.withoutPrize);\n  if(!withPrize){\n    const listSeats=listSeatsInCirc(ch,circ,false),rows={};Object.keys(listSeats).forEach(p=>rows[p]=listSeats[p]);\n    return biprop(rows,colTotals,(p,cid)=>state.collegeVotes[ch][cid]?.[p]??state.circVotes[ch][circ]?.[p]??state.nationalVotes[ch][p]??0);\n  }\n  const listSeats=listSeatsInCirc(ch,circ,true);\n  const w=scenarioPrizeWinner();\n  if(!w){\n    const rows={};Object.keys(listSeats).forEach(p=>rows[p]=listSeats[p]);\n    return biprop(rows,colTotals,(p,cid)=>state.collegeVotes[ch][cid]?.[p]??state.circVotes[ch][circ]?.[p]??state.nationalVotes[ch][p]??0);\n  }\n  const winnerLists=w.members||[];\n  const majority={},minority={};\n  Object.entries(listSeats).forEach(([p,seats])=>{if(seats>0){if(winnerLists.includes(p))majority[p]=seats;else minority[p]=seats}});\n  const groups=groupSeatsInColleges(ch,circ,true,colTotals,majority,minority);\n  const out={};\n  const allocateGroup=(lists,targetByCollege)=>{\n    const rows={};Object.keys(lists).forEach(p=>rows[p]=lists[p]);\n    if(!Object.keys(rows).length)return{};\n    return biprop(rows,targetByCollege,(p,cid)=>state.collegeVotes[ch][cid]?.[p]??state.circVotes[ch][circ]?.[p]??0);\n  };\n  const majM=allocateGroup(majority,groups.maj),minM=allocateGroup(minority,groups.min);\n  Object.keys(majM).forEach(p=>out[p]=majM[p]);\n  Object.keys(minM).forEach(p=>out[p]=minM[p]);\n  return out;\n}\nfunction findCircForCollege(ch,circ){return collegeListForCirc(ch,circ)}\nfunction candidateStore(c,p){\n  state.candidates[chamber][c.id]=state.candidates[chamber][c.id]||{};\n  state.candidates[chamber][c.id][p]=state.candidates[chamber][c.id][p]||{capolista:\"\",others:[]};\n  const x=state.candidates[chamber][c.id][p];\n  x.others=Array.isArray(x.others)?x.others:[];\n  while(x.others.length<6)x.others.push({nome:\"\",sesso:\"\",preferenze:0});\n  if(x.others.length>6)x.others=x.others.slice(0,6);\n  return x;\n}\nfunction candidateOccurrences(ch,p,name,excludeId){\n  const clean=String(name||\"\").trim().toLowerCase();if(!clean)return 0;\n  let count=0;\n  COLLEGES[ch].forEach(c=>{\n    const x=state.candidates[ch]?.[c.id]?.[p];if(!x||c.id===excludeId)return;\n    if(String(x.capolista||\"\").trim().toLowerCase()===clean)count++;\n    (x.others||[]).forEach(z=>{if(String(z.nome||\"\").trim().toLowerCase()===clean)count++});\n  });\n  return count;\n}\nfunction saveCandidateName(ch,c,p,oldName,newName){\n  const clean=String(newName||\"\").trim();\n  if(!clean)return true;\n  if(candidateOccurrences(ch,p,clean,c.id)>=5){\n    alert(\"Candidatura non salvata: lo stesso candidato non può essere inserito con lo stesso contrassegno in più di cinque collegi plurinominali.\");\n    return false;\n  }\n  return true;\n}\nfunction capAssignments(ch,p,name){\n  const clean=String(name||\"\").trim().toLowerCase();if(!clean)return[];\n  return COLLEGES[ch].filter(c=>String(state.candidates[ch]?.[c.id]?.[p]?.capolista||\"\").trim().toLowerCase()===clean).map(c=>({c,v:n(state.collegeVotes[ch][c.id]?.[p]),seats:collegeMatrix(ch,c.circ,usePrize())[p]?.[c.id]||0}));\n}\nfunction capElection(ch,p,name){\n  const a=capAssignments(ch,p,name).filter(x=>x.seats>0);\n  a.sort((x,y)=>x.v-y.v||x.c.id.localeCompare(y.c.id));\n  return a[0]||null;\n}\nfunction electedForCollege(ch,c,p,seatsN){\n  const x=candidateStore(c,p),others=x.others.filter(z=>String(z.nome||\"\").trim()).slice().sort((a,b)=>n(b.preferenze)-n(a.preferenze));\n  const all=[{nome:x.capolista||\"Capolista da inserire\",cap:true}].concat(others.map(z=>({nome:z.nome,cap:false})));\n  return all.slice(0,seatsN).map(z=>z.nome);\n}\nfunction findCircForCollege(ch,circ){return collegeListForCirc(ch,circ)}\n\nfunction injectStyle(){\n if(document.getElementById(\"sg7style\"))return;\n const s=document.createElement(\"style\");s.id=\"sg7style\";\n s.textContent=[\n \"#sg7,#sg7 *{box-sizing:border-box!important}\",\n \"#sg7{position:fixed!important;inset:0!important;z-index:2147483640!important;display:none!important;background:#0a4ea5!important;color:#fff!important;font-family:inherit!important;overflow:auto!important;font-size:13px!important;-webkit-font-smoothing:antialiased!important}\",\n \"#sg7.open{display:block!important}.sg7tabs{position:relative!important;z-index:2147483647!important;pointer-events:auto!important}.sg7tab{position:relative!important;z-index:2147483647!important;pointer-events:auto!important;touch-action:manipulation!important}\",\n \".sg7w{max-width:1660px!important;margin:auto!important;padding:22px 24px 48px!important}\",\n \".sg7top{display:flex!important;justify-content:space-between!important;align-items:center!important;gap:16px!important;flex-wrap:wrap!important;padding:18px 20px!important;border-radius:16px!important;background:rgba(6,43,115,.90)!important;border:1px solid rgba(255,255,255,.24)!important;box-shadow:0 10px 26px rgba(0,0,0,.18)!important;color:#fff!important}.sg7top h2{margin:0!important;font-size:26px!important;line-height:1.15!important;color:#fff!important}.sg7sub{font-size:11px!important;color:#dbeafe!important;margin-top:5px!important}\",\n \".sg7tabs{display:flex!important;gap:8px!important;flex-wrap:wrap!important;margin:14px 0!important}.sg7tab{border:1px solid rgba(255,255,255,.28)!important;background:rgba(255,255,255,.10)!important;color:#fff!important;border-radius:10px!important;padding:10px 13px!important;font-weight:800!important;cursor:pointer!important}.sg7tab:hover,.sg7tab:focus{background:rgba(255,255,255,.18)!important;color:#fff!important}.sg7tab.active{background:rgba(255,255,255,.24)!important;color:#fff!important;border-color:rgba(255,255,255,.48)!important}\",\n \".sg7bar{display:flex!imp
