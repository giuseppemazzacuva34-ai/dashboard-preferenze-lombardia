<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sondaggi — Nuovo sistema elettorale</title>
<style>
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#061323;color:#eaf4fb;font-family:Arial,sans-serif}
body{overflow-x:hidden}
#page{width:100%;min-height:100vh;box-sizing:border-box;padding:12px}
#topnav{display:flex;align-items:center;margin:0 0 10px;position:sticky;top:0;z-index:50;background:#061323;padding:6px 0}#back{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 12px;border:1px solid #2b4c65;border-radius:8px;background:#0b2034;color:#eaf4fb;font-size:10px;font-weight:900;cursor:pointer}
#tab-sondaggi{display:block;width:100%;min-width:0}
@media(max-width:700px){
  #page{padding:8px}
  #topnav{display:block}
  #back{width:100%;min-height:42px;font-size:11px}
}
</style>
</head>
<body>
<div id="page">
  <div id="topnav">
    <button id="back" type="button">← TORNA ALLA DASHBOARD</button>
  </div>
  <div id="tab-sondaggi"></div>
</div>
<script>
(function(){
  "use strict";
  const back=document.getElementById("back");
  if("scrollRestoration" in history)history.scrollRestoration="manual";
  function goTop(){
    try{window.scrollTo(0,0);}catch(_){}
  }
  window.addEventListener("pageshow",goTop);
  window.addEventListener("load",()=>{goTop();setTimeout(goTop,150);setTimeout(goTop,500);});
  back.addEventListener("click",()=>{
    window.location.href="index.html?v=20261011-dashboard";
  });
  const s=document.createElement("script");
  s.id="sondaggi-app-standalone";
  s.src="sondaggi-app.js?v=20261011-scenari3";
  s.async=false;
  s.addEventListener("load",()=>{
    goTop();
    setTimeout(goTop,80);
    setTimeout(goTop,250);
    setTimeout(goTop,700);
  });
  s.addEventListener("error",()=>{
    const host=document.getElementById("tab-sondaggi");
    host.innerHTML='<div style="padding:16px;border:1px solid #7a3044;border-radius:10px;background:#321522;color:#ffd7df;font:600 13px/1.4 Arial,sans-serif">Impossibile caricare il modulo Sondaggi.</div>';
  });
  (document.head||document.documentElement).appendChild(s);
})();
</script>
</body>
</html>
