<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sondaggi — Nuovo sistema elettorale</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061323}
#app{display:block;width:100%;height:100%;border:0;background:#061323}
#loading{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#061323;color:#dbeaf3;font:700 13px Arial,sans-serif;letter-spacing:.03em}
#loading small{display:block;margin-top:8px;color:#7c98ac;font-weight:500;text-align:center}
</style>
</head>
<body>
<div id="loading"><div>CARICAMENTO SONDAGGI…<small>Apro il modulo Sondaggi completo già presente nell'applicazione.</small></div></div>
<iframe id="app" title="Sondaggi — Nuovo sistema elettorale" src="index.html?dedicated=sondaggi"></iframe>

<script>
(function(){
  const frame=document.getElementById("app");
  const loading=document.getElementById("loading");
  let opened=false,ready=false;

  function norm(v){
    return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\s+/g," ").trim();
  }

  function findSondaggiControl(d){
    const candidates=[...d.querySelectorAll("button,a,[role='button'],.side-tab,.side-home")];
    return candidates.find(el=>{
      const t=norm(el.textContent);
      if(!t || t.length>40)return false;
      return t==="SONDAGGI" || t==="📊 SONDAGGI" || t.endsWith("SONDAGGI");
    })||null;
  }

  function hasSondaggiPage(d){
    const t=norm(d.body?.innerText||"");
    return t.includes("SONDAGGI — NUOVO SISTEMA ELETTORALE") ||
           t.includes("SONDAGGI - NUOVO SISTEMA ELETTORALE") ||
           t.includes("SIMULATORE NAZIONALE E PER COLLEGIO");
  }

  function finalize(d){
    if(ready)return;
    // Lasciamo intatto il modulo originale: in questo modo grafica, calcoli,
    // pulsanti, schede e gestione candidati restano esattamente quelli della dashboard.
    d.querySelector(".app-sidebar")?.style.setProperty("display","none","important");
    d.body.style.margin="0";
    d.body.style.overflow="auto";
    const main=d.querySelector("main");
    if(main){
      main.style.margin="0";
      main.style.maxWidth="none";
      main.style.width="100%";
    }
    ready=true;
    loading.style.display="none";
  }

  function boot(){
    try{
      const d=frame.contentDocument;
      if(!d||!d.body)return;

      if(!opened){
        const control=findSondaggiControl(d);
        if(control){
          opened=true;
          control.click();
        }
      }

      if(hasSondaggiPage(d)){
        finalize(d);
        return;
      }
    }catch(e){}
    setTimeout(boot,100);
  }

  frame.addEventListener("load",()=>setTimeout(boot,80));
  [200,500,1000,1800,3000,5000,8000].forEach(ms=>setTimeout(boot,ms));
  boot();
})();
</script>
</body>
</html>
