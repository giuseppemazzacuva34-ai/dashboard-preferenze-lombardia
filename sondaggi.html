<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sondaggi — Nuovo sistema elettorale</title>
<style>
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#061323;color:#eaf4fb;font-family:Arial,sans-serif}
body{overflow-x:hidden}
#page{width:100%;min-height:100vh;box-sizing:border-box;padding:12px}
#topnav{display:flex;gap:8px;align-items:center;margin:0 0 10px;position:sticky;top:0;z-index:50;background:#061323;padding:6px 0}#back,#testsJump{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 12px;border:1px solid #2b4c65;border-radius:8px;background:#0b2034;color:#eaf4fb;font-size:10px;font-weight:900;cursor:pointer}#testsJump{border-color:#3b78a5;background:#123958}#testsJump:hover{background:#17496f}
#tab-sondaggi{display:block;width:100%;min-width:0}
@media(max-width:700px){
  #page{padding:8px}
  #topnav{display:grid;grid-template-columns:1fr 1fr}
  #back,#testsJump{width:100%;min-height:42px;font-size:11px}
}
</style>
</head>
<body>
<div id="page">
  <div id="topnav">
    <button id="back" type="button">← TORNA ALLA DASHBOARD</button>
    <button id="testsJump" type="button">SCENARI POSSIBILI</button>
  </div>
  <div id="tab-sondaggi"></div>
</div>
<script>
(function(){
  "use strict";
  const back=document.getElementById("back");
  const VIEW_KEY="sondaggi-dedicated-view-v1";
  function saveView(){
    try{
      sessionStorage.setItem(VIEW_KEY,JSON.stringify({y:window.scrollY||0,at:Date.now()}));
    }catch(_){}
  }
  const params=new URLSearchParams(window.location.search);
  const forceHome=params.get("view")==="home";
  if(forceHome){
    try{sessionStorage.removeItem(VIEW_KEY);}catch(_){}
  }
  function restoreView(){
    if(forceHome)return;
    try{
      const raw=sessionStorage.getItem(VIEW_KEY);
      if(!raw)return;
      const s=JSON.parse(raw);
      const y=Math.max(0,Number(s?.y)||0);
      if(y>0)window.scrollTo(0,y);
    }catch(_){}
  }
  let saveTick=0;
  window.addEventListener("scroll",()=>{
    if(saveTick)return;
    saveTick=requestAnimationFrame(()=>{
      saveTick=0;
      saveView();
    });
  },{passive:true});
  window.addEventListener("pagehide",saveView);
  const testsJump=document.getElementById("testsJump");
  testsJump.addEventListener("click",()=>{
    const go=()=>{
      const el=document.getElementById("sgTests");
      if(el){el.scrollIntoView({behavior:"smooth",block:"start"});return true;}
      return false;
    };
    if(!go()){
      setTimeout(go,200);
      setTimeout(go,700);
      setTimeout(go,1400);
    }
  });
  back.addEventListener("click",()=>{
    saveView();
    window.location.href="index.html?v=20261011-dashboard";
  });
  const s=document.createElement("script");
  s.id="sondaggi-app-standalone";
  s.src="sondaggi-app.js?v=20261011-scenari2";
  s.async=false;
  s.addEventListener("load",()=>{
    restoreView();
    setTimeout(restoreView,80);
    setTimeout(restoreView,250);
    setTimeout(restoreView,700);
  });
  s.addEventListener("error",()=>{
    const host=document.getElementById("tab-sondaggi");
    host.innerHTML='<div style="padding:16px;border:1px solid #7a3044;border-radius:10px;background:#321522;color:#ffd7df;font:600 13px/1.4 Arial,sans-serif">Impossibile caricare il modulo Sondaggi.</div>';
  });
  (document.head||document.documentElement).appendChild(s);
})();
</script>
</body>
</html>
