<head>
<meta charset="utf-8">

<title>Trend elettorale — analisi territoriale</title>
<style>
html,body{margin:0;padding:0;min-height:100%;background:#061323;color:#eaf4fb;font-family:Arial,sans-serif}
body{overflow-x:hidden}
#page{width:100%;min-height:100vh;box-sizing:border-box;padding:12px}
#topnav{display:flex;align-items:center;margin:0 0 10px;position:sticky;top:0;z-index:50;background:#061323;padding:6px 0}
#back{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border:1px solid #2b4c65;border-radius:8px;background:#0b2034;color:#eaf4fb;font-size:10px;font-weight:900;cursor:pointer}
#tab-sondaggi{display:block;width:100%;min-width:0}
</style>
</head>
<body>
<div id="page">
  <div id="topnav"><button id="back" type="button">← TORNA ALLA DASHBOARD</button></div>
  <div id="tab-sondaggi"></div>
</div>
<script>
(function(){
  "use strict";
  document.getElementById("back").addEventListener("click",function(){window.location.href="index.html?v=20261012-territorial2";});
  function add(id,src){
    return new Promise(function(resolve,reject){
      if(document.getElementById(id)){resolve();return;}
      var s=document.createElement("script");
      s.id=id;s.src=src;s.async=false;
      s.onload=resolve;s.onerror=function(){reject(new Error("Impossibile caricare "+src));};
      (document.head||document.documentElement).appendChild(s);
    });
  }
  async function start(){
    try{
      await add("sondaggi-law","sondaggi-law-20261008.js?v=20261012");
      await add("sondaggi-engine","sondaggi-election-engine-20261008.js?v=20261012");
      await add("trend-territorial-data","trend-territorial-data.js?v=20261012-territorial6");
      await add("sondaggi-trend-clean","sondaggi-trend-2018-2022.js?v=20261012-clean6");
      await add("trend-territorial-compact-bootstrap","trend-territorial-compact-bootstrap.js?v=20261012-v3");
      await window.SG_TERRITORIAL_COMPACT_READY;
      await add("trend-territoriale","trend-territoriale.js?v=20261012-territorial3");
    }catch(err){
      console.error("Trend bootstrap",err);
      document.getElementById("tab-sondaggi").innerHTML='<div style="padding:16px;border:1px solid #7a3044;border-radius:10px;background:#321522;color:#ffd7df;font:600 13px/1.4 Arial,sans-serif">Impossibile caricare il modulo Trend.</div>';
    }
  }
  start();
})();
</script>
</body>
</html>
