<body>
<div id="page">
  <div id="topnav"><button id="back" type="button">← TORNA ALLA DASHBOARD</button></div>
  <section id="trend-intro" aria-label="Riepilogo del modulo Trend">
    <div id="trend-kicker">ANALISI ELETTORALE</div>
    <h1>TREND · STORICO, TERRITORIO E PREVISIONE</h1>
    <p>Un'unica pagina per confronto storico 2018→2022, Europee 2019→2024, Regionali disponibili, stima per regione e collegio e collegamento con il motore dei seggi.</p>
    <div id="trend-status"><span class="ok">Caricamento dati…</span><span>20 regioni</span><span>Camera · Senato</span></div>
  </section>
  <div id="tab-sondaggi"><div id="trend-loading">Caricamento del modulo Trend…</div></div>
</div>
<script>
(function(){
  "use strict";
  document.getElementById("back").addEventListener("click",function(){window.location.href="index.html?v=20261013-trend1";});
  function add(id,src){return new Promise(function(resolve,reject){if(document.getElementById(id)){resolve();return;}var s=document.createElement("script");s.id=id;s.src=src;s.async=false;s.onload=resolve;s.onerror=function(){reject(new Error("Impossibile caricare "+src));};(document.head||document.documentElement).appendChild(s);});}
  function status(text,className){var box=document.getElementById("trend-status");if(!box)return;box.innerHTML="";String(text||"").split(" · ").forEach(function(p,i){var span=document.createElement("span");if(i===0&&className)span.className=className;span.textContent=p;box.appendChild(span);});}
  function badge(text){var box=document.getElementById("trend-status");if(!box)return;var span=document.createElement("span");span.textContent=text;box.appendChild(span);}
  async function start(){
    try{
      await add("sondaggi-law","sondaggi-law-20261008.js?v=20261013-law");
      await add("sondaggi-engine","sondaggi-election-engine-20261008.js?v=20261013-engine");
      await add("trend-territorial-data","trend-territorial-data.js?v=20261013-territorial");
      await add("sondaggi-trend-clean","sondaggi-trend-2018-2022.js?v=20261013-clean8");
      await add("trend-territorial-compact-bootstrap","trend-territorial-compact-bootstrap.js?v=20261013-compact");
      var compact=await window.SG_TERRITORIAL_COMPACT_READY;
      var cv=window.SG_TERRITORIAL_DATA&&window.SG_TERRITORIAL_DATA.compactVersions||{};
      status(compact&&compact.ok?"Dati sincronizzati":"Fallback dataset storico",compact&&compact.ok?"ok":"warn");
      badge("Politiche 2018/2022");badge("Europee 2019/2024");badge("Regionali "+(cv.regionali||"inline/fallback"));badge("20 regioni");badge("Camera · Senato");
      var loading=document.getElementById("trend-loading");if(loading)loading.remove();
      await add("trend-territoriale","trend-territoriale.js?v=20261013-calibrated4");
    }catch(err){
      console.error("Trend bootstrap",err);
      var loading=document.getElementById("trend-loading");
      if(loading)loading.textContent="Impossibile caricare il modulo Trend: "+String(err&&err.message||err);
      status("Errore di caricamento","warn");
    }
  }
  start();
})();
</script>
</body>
