name: Build TREND regional data

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_trend_regionali.py"
      - ".github/workflows/build-trend-regionali.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build regional dataset
        run: python scripts/build_trend_regionali.py

      - name: Validate coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/trend-regionali-generated.json").read_text(encoding="utf-8"))
          expected = {
            "Abruzzo","Basilicata","Calabria","Campania","Emilia-Romagna",
            "Friuli-Venezia Giulia","Lazio","Liguria","Lombardia","Marche",
            "Molise","Piemonte","Puglia","Sardegna","Sicilia","Toscana",
            "Umbria","Valle d'Aosta","Veneto"
          }
          got=set(d.get("byRegion",{}))
          missing=sorted(expected-got)
          incomplete=sorted(r for r in expected if len(d["byRegion"].get(r,[])) < 2)
          if missing or incomplete:
            raise SystemExit(f"coverage failure; missing={missing}; incomplete={incomplete}")
          assert d["version"]=="2026-10-12-regionali1"
          print("TREND regional coverage: OK", len(got), "regions")
          PY

      - name: Commit generated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trend-regionali-generated.json
          git diff --cached --quiet && exit 0
          git commit -m "TREND: build compact regional territorial dataset"
          git push
