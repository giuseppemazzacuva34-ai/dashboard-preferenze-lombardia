name: Inspect dashboard functions

on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/inspect-dashboard.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract function map
        run: |
          python - <<'PY'
          import base64,gzip,re
          html=open("index.html","r",encoding="utf-8").read()
          m=re.search(r'const b64="([^"]+)"',html)
          src=gzip.decompress(base64.b64decode(m.group(1))).decode("utf-8")
          out=[]
          for pat in [
              r'function\s+[A-Za-z0-9_$]+\s*\([^)]*\)',
              r'(?:window\.)?[A-Za-z0-9_$]+\s*=\s*(?:async\s*)?\([^)]*\)\s*=>',
              r'(?:window\.)?[A-Za-z0-9_$]+\s*=\s*function\s*\([^)]*\)'
          ]:
              for m0 in re.finditer(pat,src):
                  i=m0.start()
                  out.append(src[max(0,i-120):min(len(src),i+260)])
          seen=set(); uniq=[]
          for x in out:
              if x not in seen: seen.add(x); uniq.append(x)
          text="\n\n---\n\n".join(uniq)
          open("function-map.txt","w",encoding="utf-8").write(text)
          print("functions",len(uniq),"chars",len(text))
          PY
      - name: Commit function map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add function-map.txt
          git diff --cached --quiet && exit 0
          git commit -m "Map dashboard calculation functions"
          git push
