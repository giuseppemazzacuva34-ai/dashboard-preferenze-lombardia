name: Decode dashboard source

on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/decode-dashboard.yml'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and extract calculation snippets
        run: |
          python - <<'PY'
          import base64, gzip, re
          html = open("index.html", "r", encoding="utf-8").read()
          m = re.search(r'const b64="([^"]+)"', html)
          if not m:
              raise SystemExit("b64 payload not found")
          decoded = gzip.decompress(base64.b64decode(m.group(1))).decode("utf-8")
          open("decoded-dashboard.html", "w", encoding="utf-8").write(decoded)

          patterns = [
              r'.{0,1800}seggi.{0,3000}',
              r'.{0,1800}premio.{0,3000}',
              r'.{0,1800}special.{0,3000}',
              r'.{0,1800}colleg.{0,3000}',
              r'.{0,1800}scenario.{0,3000}',
              r'.{0,1800}riparto.{0,3000}',
          ]
          text = decoded
          chunks = []
          for p in patterns:
              for m in re.finditer(p, text, re.I|re.S):
                  chunks.append("PATTERN "+p+"\n"+m.group(0))
          # de-duplicate repeated chunks
          seen=set(); out=[]
          for c in chunks:
              if c not in seen:
                  seen.add(c); out.append(c)
          open("analysis-snippets.txt","w",encoding="utf-8").write("\n\n===== SNIPPET =====\n\n".join(out))
          print("decoded",len(decoded),"snippets",len(out))
          PY
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decoded-dashboard.html analysis-snippets.txt
          git diff --cached --quiet && exit 0
          git commit -m "Extract dashboard calculation snippets"
          git push
