name: Decode dashboard source

on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/decode-dashboard.yml'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode compressed dashboard
        run: |
          python - <<'PY'
          import base64, gzip, re
          html = open("index.html", "r", encoding="utf-8").read()
          m = re.search(r'const b64="([^"]+)"', html)
          if not m:
              raise SystemExit("b64 payload not found")
          raw = base64.b64decode(m.group(1))
          decoded = gzip.decompress(raw).decode("utf-8")
          open("decoded-dashboard.html", "w", encoding="utf-8").write(decoded)
          print("decoded", len(decoded))
          PY
      - name: Commit decoded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decoded-dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m "Decode dashboard source for calculation update"
          git push
