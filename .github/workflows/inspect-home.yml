name: Inspect home logic

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  inspect:
    if: contains(github.event.head_commit.message, 'Inspect home logic')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and extract home
        shell: python
        run: |
          import base64,gzip,re
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          m=re.search(r'const b64="([^"]+)"',s)
          if not m: raise SystemExit("b64 non trovato")
          src=gzip.decompress(base64.b64decode(m.group(1))).decode("utf-8")
          terms=["function renderHome","function setMacro","function setElectionData","k-comuni","EURO_RAW","REGIONALI 2023","Europee 2024"]
          hits=[]
          for t in terms:
              i=src.find(t)
              if i>=0:
                  hits.append("TERM="+t+" IDX="+str(i)+"\n"+src[max(0,i-3500):i+12000])
          Path("home-snippet.txt").write_text("\n====\n".join(hits) or "NESSUN MATCH",encoding="utf-8")

          # Analisi GEO: elenco amministrativo usato dalla dashboard. 
          # Verifica richiesta. Dataset.
          gi=src.find("const GEO=")
          if gi<0: gi=src.find("GEO=[")
          if gi<0: raise SystemExit("GEO non trovato")
          start=src.find("[",gi)
          end=src.find("];",start)
          if start<0 or end<0: raise SystemExit("array GEO non trovato")
          # Il dataset è JavaScript valido: isola l'array e prova a valutarlo.
          import json
          arrtxt=src[start:end+1]
          try:
              geo=json.loads(arrtxt)
          except Exception:
              # normalizzazione minima per eventuali apici JS
              import ast
              geo=ast.literal_eval(arrtxt.replace("null","None").replace("true","True").replace("false","False"))
          from collections import Counter
          def norm(v):
              import unicodedata,re
              return re.sub(r"\\s+"," ",unicodedata.normalize("NFD",str(v or "")).encode("ascii","ignore").decode()).upper().strip()
          by_istat=Counter(str(x.get("istat","")) for x in geo)
          by_name=Counter((norm(x.get("prov")),norm(x.get("comune"))) for x in geo)
          dup_istat=[(k,v) for k,v in by_istat.items() if k and v>1]
          dup_name=[(k,v) for k,v in by_name.items() if k and v>1]
          lines=[
              "GEO_LEN="+str(len(geo)),
              "UNIQUE_ISTAT="+str(len({str(x.get('istat','')) for x in geo if x.get('istat')})),
              "DUP_ISTAT="+repr(dup_istat),
              "DUP_NAME="+repr(dup_name),
              "",
              "ELENCO GEO (prov|comune|istat):"
          ]
          lines += [f"{x.get('prov','')}|{x.get('comune','')}|{x.get('istat','')}" for x in sorted(geo,key=lambda z:(norm(z.get('prov')),norm(z.get('comune'))))]
          lines += ["", "TARGET ROWS:"]
          for q in ["Ronago","Uggiate-Trevano","Campospinoso","Albaredo Arnoboldi","Lirio","Montalto Pavese","Bardello","Bregano","Malgesso"]:
              lines += [repr(x) for x in geo if norm(x.get("comune"))==norm(q)]
                    # Controlla anche i nomi presenti nei due dataset elettorali.
          def parse_js_array(label):
              ai=src.find(label)
              if ai<0: return []
              a=src.find("[",ai); b=src.find("];",a)
              return json.loads(src[a:b+1])
          for label,name in [("const RAW=","RAW"),("const EURO_RAW=","EURO_RAW")]:
              arr=parse_js_array(label)
              lines += ["", name+"_LEN="+str(len(arr))]
              for q in ["Ronago","Uggiate-Trevano","Uggiate con Ronago","Albaredo Arnaboldi","Campospinoso","Campospinoso Albaredo","Lirio","Montalto Pavese","Bardello","Bregano","Malgesso","Bardello con Malgesso e Bregano"]:
                  n=sum(1 for x in arr if norm(x.get("comune"))==norm(q))
                  if n: lines += [name+"|"+q+"|"+str(n)]
          # FIX DEFINITIVO GEO: allinea la dashboard ai 1.501 comuni lombardi vigenti.
          # Mantiene le collegiature dei territori accorpati e canonicalizza i nomi storici
          # dei dataset elettorali verso il comune attuale.
          current_geo=[]
          for x in geo:
              cc=norm(x.get("comune"))
              if cc in {"RONAGO","UGGIATE-TREVANO","ALBAREDO ARNABOLDI","LIRIO","BARDELLO","BREGANO","MALGESSO"}:
                  continue
              y=dict(x)
              if cc=="CAMPOSPinoso".upper():
                  y["comune"]="Campospinoso Albaredo"
              current_geo.append(y)
          # Uggiate con Ronago
          base=next(x for x in geo if norm(x.get("comune"))=="RONAGO")
          y=dict(base); y["comune"]="Uggiate con Ronago"; y["istat"]="13256"
          current_geo.append(y)
          # Bardello con Malgesso e Bregano
          base=next(x for x in geo if norm(x.get("comune"))=="BARDELLO")
          y=dict(base); y["comune"]="Bardello con Malgesso e Bregano"; y["istat"]="12144"
          current_geo.append(y)
          assert len(current_geo)==1501, "GEO corrente atteso 1501, ottenuto "+str(len(current_geo))
          newgeo=json.dumps(current_geo,ensure_ascii=False,separators=(",",":"))
          src=src[:start]+newgeo+src[end+1:]
          alias_code="const CURRENT_COMUNE_ALIASES={"+",".join([
              '"RONAGO":"Uggiate con Ronago"',
              '"UGGIATE-TREVANO":"Uggiate con Ronago"',
              '"ALBAREDO ARNABOLDI":"Campospinoso Albaredo"',
              '"LIRIO":"Montalto Pavese"',
              '"BARDELLO":"Bardello con Malgesso e Bregano"',
              '"BREGANO":"Bardello con Malgesso e Bregano"',
              '"MALGESSO":"Bardello con Malgesso e Bregano"'
          ])+"};const currentComune=s=>CURRENT_COMUNE_ALIASES[norm(s)]||s;"
          anchor="const esc=s=>String(s??'').replace("
          ni=src.find("const esc=")
          if ni<0: raise SystemExit("ancora norm/esc non trovata")
          # Inserisci l'alias subito dopo la funzione norm.
          norm_anchor="const norm=s=>String(s||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'');"
          if norm_anchor in src and "CURRENT_COMUNE_ALIASES" not in src:
              src=src.replace(norm_anchor,norm_anchor+alias_code,1)
          oldmap="geo:geoMap.get(norm(r.prov)+'|'+norm(r.comune))||null"
          newmap="comune:currentComune(r.comune),geo:geoMap.get(norm(r.prov)+'|'+norm(currentComune(r.comune)))||null"
          src=src.replace(oldmap,newmap)
          # Ricomprimi il sorgente aggiornato nell'HTML contenitore.
          newb64=base64.b64encode(gzip.compress(src.encode("utf-8"),mtime=0)).decode("ascii")
          s2=re.sub(r'const b64="[^"]+"','const b64="'+newb64+'"',s,count=1)
          Path("index.html").write_text(s2,encoding="utf-8")
          lines += ["", "CURRENT_GEO_LEN="+str(len(current_geo)), "CURRENT_GEO_UNIQUE_ISTAT="+str(len({str(x.get("istat","")) for x in current_geo if x.get("istat")}))]
          lines += ["CURRENT_GEO_TARGETS="+repr([x for x in current_geo if norm(x.get("comune")) in {"UGGIATE CON RONAGO","CAMPOSPinosO ALBAREDO".upper(),"MONTALTO PAVESE","BARDELLO CON MALGESSO E BREGANO"}])]
          Path("geo-check.txt").write_text("\n".join(lines),encoding="utf-8")
      - name: Commit inspection
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home-snippet.txt geo-check.txt
          git commit -m "Inspect home logic" || exit 0
          git push
