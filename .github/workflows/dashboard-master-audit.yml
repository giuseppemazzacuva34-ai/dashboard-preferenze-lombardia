name: Dashboard Master Audit
# Master audit: data, geografia, preferenze e motore seggi

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  master-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run master audit
        run: python3 scripts/master_dashboard_audit.py
