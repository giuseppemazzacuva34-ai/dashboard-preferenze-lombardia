name: Extract dashboard source
on:
  push:
    paths-ignore:
      - "debug/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and summarize
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'), zlib=require('zlib');
          const s=fs.readFileSync('index.html','utf8');
          const m=s.match(/const b64="([^"]+)"/);
          if(!m) throw new Error('b64 not found');
          const html=zlib.gunzipSync(Buffer.from(m[1],'base64')).toString('utf8');
          fs.mkdirSync('debug',{recursive:true});
          const lines=html.split(/\r?\n/);
          const keys=['ticket','aggiungi','corrente','salva','classificazioni','localStorage'];
          let out='LENGTH='+html.length+'\\nLINES='+lines.length+'\\n\\n';
          for(let i=0;i<lines.length;i++){
            const low=lines[i].toLowerCase();
            if(keys.some(k=>low.includes(k))){
              out+='===== LINE '+(i+1)+' =====\\n';
              out+=lines.slice(Math.max(0,i-10),Math.min(lines.length,i+11)).join('\\n')+'\\n\\n';
            }
          }
          fs.writeFileSync('debug/key-lines.txt',out);
          fs.writeFileSync('debug/head.txt',lines.slice(0,140).join('\\n'));
          fs.writeFileSync('debug/tags.txt',lines.filter(x=>x.toLowerCase().includes('<script')||x.toLowerCase().includes('<button')||x.toLowerCase().includes('<input')||x.toLowerCase().includes('function')||x.toLowerCase().includes('onclick')).slice(0,250).join('\\n'));
          const funcs=[...html.matchAll(/(?:async\\s+)?function\\s+([A-Za-z0-9_$]+)/g)].map(m=>m[1]);
          fs.writeFileSync('debug/functions.txt',[...new Set(funcs)].join('\\n'));
          NODE
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/key-lines.txt debug/functions.txt debug/head.txt debug/tags.txt
          git commit -m "debug: estrai riferimenti dashboard" || exit 0
          git push
